    <!-- 左侧主笔画（横与撇） -->
    <path d="M 351 206
             L 475 222
             L 438 332
             L 602 310
             L 586 388
             L 415 413
             C 402 510, 330 705, 246 836
             L 150 792
             C 225 675, 290 535, 335 425
             L 184 448
             L 180 368
             L 353 344
             Z" />

    <!-- 右上短横 -->
    <path d="M 450 483
             C 540 466, 650 454, 757 452
             L 752 538
             C 650 536, 545 544, 465 560
             Z" />

    <!-- 右下弧钩 -->
    <path d="M 437 650
             L 508 663
