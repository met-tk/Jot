<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- 正方形底板：rx="220" 约 22% 圆角，对齐 Windows 11 / iOS App 图标视觉规范 -->
  <rect width="1000" height="1000" rx="220" fill="#FFFFFF" />

  <!-- 图形主体（整体包含约 15% 安全边距，并已做视觉光学居中补偿） -->
